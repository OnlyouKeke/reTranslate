name: Multi-Platform CI

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main", "release" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test-native:
    name: Test (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libwayland-dev \
            pkg-config

      - name: Cargo Check
        run: cargo check --target ${{ matrix.target }}

      - name: Cargo Check Binaries
        run: cargo check --bin retranslate --target ${{ matrix.target }}

      - name: Run Test Suites
        run: cargo test --target ${{ matrix.target }} --tests -- --nocapture

  check-cross-targets:
    name: Cross Check (${{ matrix.name }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: Windows ARM64
            setup: none
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS Intel
            setup: none
          # Linux i686 (32-bit)
          - os: ubuntu-22.04
            target: i686-unknown-linux-gnu
            name: Linux i686
            setup: i686
          # Linux ARM64
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            name: Linux ARM64
            setup: aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Linux Cross Tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          if [ "${{ matrix.setup }}" = "aarch64" ]; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu pkg-config
            echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
          elif [ "${{ matrix.setup }}" = "i686" ]; then
            sudo dpkg --add-architecture i386
            sudo apt-get update
            sudo apt-get install -y gcc-multilib g++-multilib pkg-config \
              libasound2-dev:i386 libx11-dev:i386 libxcursor-dev:i386 libxi-dev:i386 \
              libxinerama-dev:i386 libxrandr-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386
            echo "PKG_CONFIG_ALLOW_CROSS=1" >> $GITHUB_ENV
            echo "PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig" >> $GITHUB_ENV
            echo "CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_RUSTFLAGS=-C link-arg=-m32" >> $GITHUB_ENV
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cargo Check Target
        run: cargo check --target ${{ matrix.target }}

      - name: Cargo Check Binary Target
        run: cargo check --bin retranslate --target ${{ matrix.target }}
